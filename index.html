<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ဖတ်ဖူးတဲ့ စာအုပ်များ</title>
<meta name="description" content="စာအုပ်ဖတ်ပြီး တွေးမိတာတွေကို ရေးထားတာ — ဟိန်းထက်">

<!-- set theme before paint so the page never flashes the wrong colours -->
<script>
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) { t = null; }
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>

<style>
  /* ---------- font ---------- */
  @font-face {
    font-family: 'Pyidaungsu';
    src: url('Pyidaungsu-2.5.3_Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  /* ---------- tokens ---------- */
  :root {
    /* every size below is in rem, so this one number scales the whole page */
    font-size: 15px;

    --paper:  #f1efe9;
    --ink:    #3b3833;
    --muted:  #8b8578;
    --rule:   #e2ded4;
    --accent: #55665f;
    --shell:  #e7e3d9;

    --content: 46rem;   /* one comfortable reading column, like a blog */
  }

  :root[data-theme='dark'] {
    --paper:  #1a1917;
    --ink:    #d4cec2;
    --muted:  #857f74;
    --rule:   #2e2c28;
    --accent: #92a89d;
    --shell:  #26241f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Pyidaungsu', 'Noto Sans Myanmar', sans-serif;
    font-size: 1rem;
    line-height: 2;
    letter-spacing: 0.005em;
    padding: 4.5rem 1.6rem 8rem;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* Myanmar line breaking: only break where we inserted a zero-width space,
     never in the middle of a syllable cluster. */
  body, h1, h2, p, .note, .meta {
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
    hyphens: none;
  }

  a { color: inherit; text-decoration: none; }

  .container { max-width: var(--content); margin: 0 auto; }

  /* ---------- header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.6rem;
    padding-bottom: 1.6rem;
    border-bottom: 1px solid var(--rule);
  }

  .site-title { font-size: 1.45rem; font-weight: 400; line-height: 1.6; letter-spacing: 0.01em; }
  .site-title a:hover { color: var(--accent); }

  .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }

  .who { display: flex; align-items: center; gap: 0.8rem; flex-shrink: 0; }
  .who-name { font-size: 0.9rem; color: var(--muted); }

  .avatar {
    width: 3.6rem; height: 3.6rem;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--shell);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 1.05rem; line-height: 1;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- small text buttons ---------- */
  .link {
    background: none;
    border: none;
    font: inherit;
    font-size: 0.87rem;
    color: var(--muted);
    cursor: pointer;
    padding: 0.13rem 0;
    border-bottom: 1px solid transparent;
    transition: color 0.2s;
  }

  .link:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---------- home: controls ---------- */
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-top: 1.6rem;
    flex-wrap: wrap;
  }

  .count { font-size: 0.87rem; color: var(--muted); }
  .actions { display: flex; align-items: baseline; gap: 1.35rem; }

  .years {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.2rem;
    margin-top: 1rem;
  }

  .year {
    background: none; border: none; font: inherit; font-size: 0.9rem;
    color: var(--muted); cursor: pointer; padding: 0.13rem 0;
    border-bottom: 1px solid transparent; transition: color 0.2s;
  }

  .year:hover { color: var(--accent); }
  .year.on { color: var(--ink); border-bottom-color: var(--accent); }

  .search {
    display: none;
    gap: 1.6rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .search.open { display: flex; }
  .field { flex: 1 1 12rem; }

  .field input {
    width: 100%;
    padding: 0.27rem 0 0.6rem;
    border: none;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
  }

  .field input::placeholder { color: var(--muted); }
  .field input:focus { border-bottom-color: var(--accent); }

  /* ---------- home: post list ---------- */
  .list { margin-top: 0.6rem; }

  .card { padding: 2.1rem 0; border-bottom: 1px solid var(--rule); }

  /* a card with a cover: small picture on the left, text on the right */
  .card.has-cover {
    display: grid;
    grid-template-columns: 5.2rem minmax(0, 1fr);
    gap: 1.4rem;
    align-items: start;
  }

  .cover {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 3px;
    background: var(--shell);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.08);
  }

  .card .cover-link { margin-top: 0.45rem; }

  .post-head.has-cover {
    display: grid;
    grid-template-columns: 9rem minmax(0, 1fr);
    gap: 1.8rem;
    align-items: start;
  }

  .card-meta, .post-meta { font-size: 0.85rem; color: var(--muted); }
  .card-meta .dot, .post-meta .dot { margin: 0 0.45rem; opacity: 0.6; }

  .card h2 { font-size: 1.3rem; font-weight: 400; line-height: 1.7; margin-top: 0.3rem; }
  .card h2 a { transition: color 0.2s; }
  .card h2 a:hover { color: var(--accent); }

  .card .writer { font-size: 0.95rem; color: var(--accent); }

  .excerpt {
    margin-top: 0.7rem;
    color: var(--ink);
    opacity: 0.85;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .more {
    display: inline-block;
    margin-top: 0.7rem;
    font-size: 0.87rem;
    color: var(--accent);
    border-bottom: 1px solid transparent;
  }

  .more:hover { border-bottom-color: var(--accent); }

  /* ---------- post page ---------- */
  .back { display: inline-block; margin-top: 1.6rem; font-size: 0.87rem; color: var(--muted); }
  .back:hover { color: var(--accent); }

  .post { padding-top: 2.4rem; }

  .post h1 { font-size: 2rem; font-weight: 400; line-height: 1.6; margin-top: 0.4rem; }

  .post .writer { font-size: 1.05rem; color: var(--accent); margin-top: 0.2rem; }

  .meta {
    margin-top: 1.4rem;
    padding: 0.9rem 1.1rem;
    background: var(--shell);
    border-radius: 6px;
    font-size: 0.92rem;
  }

  .meta div { display: flex; gap: 0.7rem; }
  .meta b { font-weight: 400; color: var(--muted); flex-shrink: 0; }

  .note-label {
    margin-top: 2.2rem;
    font-size: 0.82rem;
    color: var(--muted);
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }

  .note {
    margin-top: 1.4rem;
    font-size: 1.07rem;
    line-height: 2.15;
  }

  /* space between paragraphs: about half a line, so each one reads as a
     block without the page feeling gappy */
  .note p + p { margin-top: 1.05em; }

  .post-tools {
    display: flex;
    justify-content: flex-end;
    gap: 1.35rem;
    margin-top: 2.4rem;
  }

  .neighbours {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
    margin-top: 1.4rem;
    padding-top: 1.6rem;
    border-top: 1px solid var(--rule);
  }

  .neighbours a {
    display: block;
    padding: 0.9rem 1rem;
    border: 1px solid var(--rule);
    border-radius: 6px;
    transition: border-color 0.2s;
  }

  .neighbours a:hover { border-color: var(--accent); }
  .neighbours .next { text-align: right; grid-column: 2; }
  .neighbours small { display: block; font-size: 0.8rem; color: var(--muted); }
  .neighbours span { display: block; line-height: 1.7; margin-top: 0.2rem; }

  /* ---------- states ---------- */
  .state { padding: 4.3rem 0; color: var(--muted); font-size: 0.95rem; }
  .state small { display: block; margin-top: 0.55rem; opacity: 0.7; font-size: 0.8rem; }

  /* ---------- pagination ---------- */
  .pages {
    display: flex; justify-content: center; align-items: center;
    gap: 1.35rem; margin-top: 2.9rem; flex-wrap: wrap;
  }

  .page {
    background: none; border: none; font: inherit; font-size: 0.9rem;
    color: var(--muted); cursor: pointer; padding: 0.13rem 0;
    border-bottom: 1px solid transparent; min-width: 1.2rem;
  }

  .page:hover:not(:disabled) { color: var(--accent); }
  .page.on { color: var(--ink); border-bottom-color: var(--accent); }
  .page:disabled { opacity: 0.28; cursor: default; }

  .dots { color: var(--muted); }
  .page-note { margin-top: 0.8rem; text-align: center; font-size: 0.83rem; color: var(--muted); }

  footer {
    margin-top: 4rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--rule);
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }

  .credits {
    max-width: 34rem;
    margin: 0.6rem auto 0;
    font-size: 0.72rem;
    line-height: 1.7;
    opacity: 0.8;
  }

  .credits a, .cover-credit a { text-decoration: underline; text-underline-offset: 2px; }

  .cover-fig { margin: 0; }

  .cover-credit {
    margin-top: 0.45rem;
    font-size: 0.68rem;
    line-height: 1.5;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  [hidden] { display: none !important; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 620px) {
    body { padding: 2.4rem 1rem 4.8rem; }
    .who-name { display: none; }
    .site-title { font-size: 1.25rem; }
    .post h1 { font-size: 1.6rem; }
    .note { font-size: 1.02rem; }
    .card.has-cover { grid-template-columns: 4.2rem minmax(0, 1fr); gap: 1rem; }
    .post-head.has-cover { grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1.1rem; }
    .neighbours { grid-template-columns: 1fr; }
    .neighbours .next { grid-column: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <p class="site-title"><a href="#/">ဖတ်ဖူးတဲ့ စာအုပ်များ</a></p>
      <p class="subtitle">စာအုပ်ဖတ်ပြီး တွေးမိတာတွေ</p>
    </div>
    <div class="who">
      <span class="who-name">ဟိန်းထက်</span>
      <div class="avatar" id="avatar"><img id="avatarImg" alt="ဟိန်းထက်"></div>
    </div>
  </header>

  <!-- home: list of posts -->
  <section id="home">
    <div class="bar">
      <span class="count" id="count"></span>
      <div class="actions">
        <button class="link theme-btn">Dark</button>
        <button class="link" id="toggle">ရှာရန်</button>
      </div>
    </div>

    <div class="years" id="years"></div>

    <div class="search" id="search">
      <div class="field"><input type="text" id="qBook" placeholder="စာအုပ်နာမည်"></div>
      <div class="field"><input type="text" id="qWriter" placeholder="စာရေးသူ"></div>
      <button class="link" id="clear">ဖျက်</button>
    </div>

    <div class="list" id="list"><p class="state">ခဏစောင့်ပါ…</p></div>
    <div id="pages"></div>
  </section>

  <!-- one post -->
  <section id="single" hidden>
    <a class="back" href="#/">← စာအုပ်အားလုံး</a>
    <article class="post" id="post"></article>
  </section>

  <footer>
    ဟိန်းထက် · ဖတ်ဖူးတဲ့ စာအုပ်များ
    <p class="credits" id="credits"></p>
  </footer>
</div>

<script>
  /* ---------- settings ---------- */
  const CSV_URL    = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQGqSeOBUkUNLG0seN_cGPtDp9ldSvKasKVdeDCCliwHwVZQWLRQMtRgbOOtJLUFeZZ9dNiS49GlTKK/pub?gid=910367330&single=true&output=csv';
  const PER_PAGE   = 10;
  const ONLY_EMAIL = 'mynameisheinhtet@gmail.com';
  const SITE_TITLE = 'ဖတ်ဖူးတဲ့ စာအုပ်များ';

  const PROFILE_SOURCES = ['profile.png'];

  const COL_TIME = 0, COL_EMAIL = 1, COL_BOOK = 2, COL_WRITER = 3, COL_TRANS_FROM = 4,
        COL_ORIG_BOOK = 5, COL_ORIG_WRITER = 6, COL_DATE = 9,
        COL_COMMENT = 10, COL_MONTH = 11, COL_YEAR = 12;

  const MONTHS_MY = ['ဇန်နဝါရီ','ဖေဖော်ဝါရီ','မတ်','ဧပြီ','မေ','ဇွန်',
                     'ဇူလိုင်','ဩဂုတ်','စက်တင်ဘာ','အောက်တိုဘာ','နိုဝင်ဘာ','ဒီဇင်ဘာ'];

  const MONTH_EN = ['january','february','march','april','may','june',
                    'july','august','september','october','november','december',
                    'jan','feb','mar','apr','may','jun',
                    'jul','aug','sep','oct','nov','dec'];

  /* ---------- Myanmar line breaking ----------
     Chrome breaks Burmese at arbitrary points, which splits clusters like
     မယ့် into မ / ယ့်. We mark real syllable starts with a zero-width space
     and set word-break: keep-all, so the browser can only break where we say. */
  const MY_BREAK_RE = (function () {
    try {
      const CONS = '\\u1000-\\u102A\\u103F\\u104E';   // consonants + independent vowels
      const SIGN = '\\u102B-\\u1038\\u103B-\\u103E';  // medials, vowel signs, tone marks
      // a consonant starts a syllable unless it follows a virama (stacked)
      // or carries an asat (making it the coda of the syllable before it)
      return new RegExp(`(?<!\\u1039)([${CONS}])(?![${SIGN}]*[\\u103A\\u1039])`, 'g');
    } catch (e) {
      return null; // very old browser without lookbehind — leave text as is
    }
  })();

  function myBreak(s) {
    if (!MY_BREAK_RE || !s) return s;
    return s.replace(MY_BREAK_RE, '​$1');
  }

  // escape after inserting the break marks, so entities never get split
  function txt(s) { return esc(myBreak(s)); }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- profile picture ---------- */
  (function () {
    const box = document.getElementById('avatar');
    const img = document.getElementById('avatarImg');
    let i = 0;
    img.onerror = () => {
      i++;
      if (i < PROFILE_SOURCES.length) img.src = PROFILE_SOURCES[i];
      else box.textContent = 'ဟ';
    };
    img.src = PROFILE_SOURCES[0];
  })();

  /* ---------- theme ---------- */
  function paintThemeLabels() {
    const label = document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
    document.querySelectorAll('.theme-btn').forEach(b => { b.textContent = label; });
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('.theme-btn')) return;
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (err) {}
    paintThemeLabels();
  });

  paintThemeLabels();

  /* ---------- state ---------- */
  let allBooks = [], filtered = [], currentPage = 1, activeYear = 'all';
  let loaded = false, homeScroll = 0;

  const homeEl   = document.getElementById('home');
  const singleEl = document.getElementById('single');
  const postEl   = document.getElementById('post');
  const listEl   = document.getElementById('list');
  const pagesEl  = document.getElementById('pages');
  const countEl  = document.getElementById('count');
  const yearsEl  = document.getElementById('years');
  const searchEl = document.getElementById('search');
  const qBook    = document.getElementById('qBook');
  const qWriter  = document.getElementById('qWriter');

  document.getElementById('toggle').addEventListener('click', () => {
    searchEl.classList.toggle('open');
    if (searchEl.classList.contains('open')) qBook.focus();
  });

  /* ---------- csv ---------- */
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQ) {
        if (ch === '"' && next === '"') { cell += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cell += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { row.push(cell); cell = ''; }
        else if (ch === '\n' || (ch === '\r' && next === '\n')) {
          row.push(cell); cell = '';
          if (row.some(c => c !== '')) rows.push(row);
          row = [];
          if (ch === '\r') i++;
        } else cell += ch;
      }
    }
    row.push(cell);
    if (row.some(c => c !== '')) rows.push(row);
    return rows;
  }

  /* ---------- dates ---------- */
  function monthIndex(name) {
    const idx = MONTH_EN.indexOf(name.toLowerCase().replace(/\./g, ''));
    return idx >= 0 ? idx % 12 : -1;
  }

  function parseDateStr(raw) {
    if (!raw) return null;
    const str = raw.replace(/[\s ]+/g, ' ').trim();
    if (!str) return null;
    const cleaned = str.replace(/(\d+)(st|nd|rd|th)/gi, '$1');

    const dmy = cleaned.match(/^(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})$/);
    if (dmy) {
      const m = monthIndex(dmy[2]);
      if (m >= 0) return { mi: m, day: +dmy[1], year: +dmy[3] };
    }

    const mdy = cleaned.match(/^([a-zA-Z]+)\s+(\d{1,2}),?\s+(\d{4})$/);
    if (mdy) {
      const m = monthIndex(mdy[1]);
      if (m >= 0) return { mi: m, day: +mdy[2], year: +mdy[3] };
    }

    const slash = cleaned.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (slash) {
      const a = +slash[1], b = +slash[2], year = +slash[3];
      if (a > 12 && b >= 1 && b <= 12) return { mi: b - 1, day: a, year };
      if (a >= 1 && a <= 12) return { mi: a - 1, day: b, year };
    }

    const iso = cleaned.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (iso) return { mi: +iso[2] - 1, day: +iso[3], year: +iso[1] };

    const d = new Date(cleaned);
    if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
      return { mi: d.getMonth(), day: d.getDate(), year: d.getFullYear() };
    }
    return null;
  }

  function getDate(r) {
    const m = (r[COL_MONTH] || '').trim();
    const y = (r[COL_YEAR] || '').trim();
    let mi = -1, yr = 0;

    if (m) {
      mi = monthIndex(m);
      if (mi < 0) { const n = parseInt(m, 10); if (n >= 1 && n <= 12) mi = n - 1; }
      if (mi < 0) { const j = MONTHS_MY.indexOf(m); if (j >= 0) mi = j; }
    }
    if (y) yr = parseInt(y, 10) || 0;

    if (mi >= 0 && yr > 2000) {
      const raw = parseDateStr(r[COL_DATE]);
      const day = (raw && raw.year === yr && raw.mi === mi) ? raw.day : 0;
      return { mi, day, year: yr };
    }
    return parseDateStr(r[COL_DATE]);
  }

  function whenText(b) {
    if (!b.year) return '';
    if (b.mi < 0) return String(b.year);
    return (b.day ? b.day + ' ' : '') + MONTHS_MY[b.mi] + ' ' + b.year;
  }

  /* ---------- post links ----------
     Each post's address comes from the Google Form timestamp
     ("30/10/2026 17:42:00" -> "20261030-174200"), so links stay the same
     even if the sheet is re-sorted. Rows without a timestamp fall back to
     their row number. */
  function slugFor(r, rowIndex) {
    const m = (r[COL_TIME] || '').trim()
      .match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/);
    if (!m) return 'r' + (rowIndex + 2);
    const p = n => String(n).padStart(2, '0');
    return m[3] + p(m[2]) + p(m[1]) + '-' + p(m[4]) + m[5] + m[6];
  }

  /* ---------- book covers ----------
     Add a column titled "Cover" anywhere in the sheet. In it, put any of:
       - a link to an image          https://…/cover.jpg
       - a Google Drive share link   https://drive.google.com/file/d/<id>/view
                                     (the file must be shared "Anyone with the link")
       - a file name                 sphinx.jpg  -> loads covers/sphinx.jpg from this repo
     Leave it empty for no picture. */
  function coverUrl(raw) {
    const v = (raw || '').trim();
    if (!v) return '';
    const drive = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/);
    if (drive) return 'https://drive.google.com/thumbnail?id=' + drive[1] + '&sz=w600';
    if (/^https?:\/\//i.test(v)) return v;
    if (/^[\w.\- ]+\.(jpe?g|png|webp|gif|avif)$/i.test(v)) return 'covers/' + encodeURIComponent(v);
    return '';
  }

  function coverImg(b, cls = 'cover') {
    // hide the picture (and its space) if the link turns out to be broken
    const src = b.cover.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    // some sites send a 1×1 blank instead of an error, so treat tiny images as missing too
    return `<img class="${cls}" src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer"`
      + ` onerror="dropCover(this)" onload="if (this.naturalWidth < 20) dropCover(this)">`;
  }

  function dropCover(img) {
    const box = img.closest('.has-cover');
    if (box) box.classList.remove('has-cover');
    (img.closest('.cover-link') || img.closest('.cover-fig') || img).remove();
  }

  /* ---------- cover credits ----------
     The sheet's "Cover source" column says where each picture came from.
     Named sources get a small credit under the cover; entries like
     "Found online (source not recorded)" or "My own ebook copy" don't,
     and are covered by the general note in the footer. */
  function namedSource(raw) {
    const v = (raw || '').trim();
    if (!v || /^found online|^my own|not recorded/i.test(v)) return '';
    return v;
  }

  function sourceLink(src) {
    if (/^open library$/i.test(src)) return 'https://openlibrary.org';
    if (/^[\w-]+(\.[\w-]+)+$/.test(src)) return 'https://' + src;
    return '';
  }

  function creditHtml(src) {
    const url = sourceLink(src);
    const name = esc(src);
    return url ? `<a href="${url}" target="_blank" rel="noopener">${name}</a>` : name;
  }

  function renderCredits() {
    const el = document.getElementById('credits');
    if (!el) return;
    const named = [...new Set(allBooks.filter(b => b.cover && b.coverSrc).map(b => b.coverSrc))];
    el.innerHTML = 'Book covers belong to their publishers and artists and are shown here only to '
      + 'identify the books. Cover images come from '
      + (named.length ? named.map(creditHtml).join(', ') + ' and other sites' : 'various sites')
      + ', and from the books themselves.';
  }

  /* ---------- load ---------- */
  async function loadData() {
    try {
      const res = await fetch(CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const all = parseCSV(await res.text());
      const header = (all[0] || []).map(h => h.trim().toLowerCase());
      const colCover = header.findIndex(h => h === 'cover' || h === 'မျက်နှာဖုံး');
      const colCoverSrc = header.findIndex(h => h === 'cover source');
      const rows = all.slice(1);

      const seen = new Set();
      allBooks = rows.map((r, rowIndex) => {
        const email = (r[COL_EMAIL] || '').trim().toLowerCase();
        const book  = (r[COL_BOOK] || '').trim();
        if (email !== ONLY_EMAIL || !book) return null;
        const dt = getDate(r);
        let slug = slugFor(r, rowIndex);
        if (seen.has(slug)) slug = 'r' + (rowIndex + 2);
        seen.add(slug);
        return {
          rowIndex,
          slug,
          book,
          writer:     (r[COL_WRITER] || '').trim(),
          transFrom:  (r[COL_TRANS_FROM] || '').trim(),
          origBook:   (r[COL_ORIG_BOOK] || '').trim(),
          origWriter: (r[COL_ORIG_WRITER] || '').trim(),
          comment:    (r[COL_COMMENT] || '').trim(),
          cover:      colCover >= 0 ? coverUrl(r[colCover]) : '',
          coverSrc:   colCoverSrc >= 0 ? namedSource(r[colCoverSrc]) : '',
          mi:   dt ? dt.mi : -1,
          day:  dt ? (dt.day || 0) : 0,
          year: dt ? dt.year : 0
        };
      }).filter(Boolean);

      // newest first; undated entries sink to the bottom in sheet order
      allBooks.sort((a, b) => {
        if (!a.year && !b.year) return b.rowIndex - a.rowIndex;
        if (!a.year) return 1;
        if (!b.year) return -1;
        return (b.year - a.year) || (b.mi - a.mi) || (b.day - a.day) || (b.rowIndex - a.rowIndex);
      });

      loaded = true;

      if (!allBooks.length) {
        listEl.innerHTML = '<p class="state">စာအုပ်မှတ်တမ်း မရှိသေးပါ</p>';
        return;
      }

      renderYears();
      renderCredits();
      applyFilters(false);
      route();
    } catch (err) {
      const msg = '<p class="state">ဒေတာ ခေါ်မရပါ။ Sheet ကို Publish လုပ်ထားခြင်း ရှိ၊ မရှိ စစ်ပါ။'
        + '<small>' + esc(err.message) + '</small></p>';
      listEl.innerHTML = msg;
      postEl.innerHTML = msg;
    }
  }

  /* ---------- routing: #/ is the list, #/<slug> is one post ---------- */
  function currentSlug() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    return h.trim();
  }

  function route() {
    const slug = currentSlug();

    if (!slug) {
      singleEl.hidden = true;
      homeEl.hidden = false;
      document.title = SITE_TITLE;
      window.scrollTo(0, homeScroll);
      return;
    }

    homeEl.hidden = true;
    singleEl.hidden = false;
    if (!loaded) { postEl.innerHTML = '<p class="state">ခဏစောင့်ပါ…</p>'; return; }
    renderPost(slug);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);

  // remember where we were in the list before opening a post
  listEl.addEventListener('click', e => {
    if (e.target.closest('a[href^="#/"]')) homeScroll = window.scrollY;
  });

  /* ---------- year filter ---------- */
  function renderYears() {
    const years = [...new Set(allBooks.map(b => b.year).filter(Boolean))].sort((a, b) => b - a);
    if (!years.length) { yearsEl.innerHTML = ''; return; }

    yearsEl.innerHTML =
      '<button class="year on" data-year="all">အားလုံး</button>'
      + years.map(y => `<button class="year" data-year="${y}">${y}</button>`).join('');

    yearsEl.querySelectorAll('.year').forEach(btn => {
      btn.addEventListener('click', () => {
        activeYear = btn.dataset.year;
        yearsEl.querySelectorAll('.year').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        applyFilters();
      });
    });
  }

  function applyFilters(resetPage = true) {
    const bq = qBook.value.trim().toLowerCase();
    const wq = qWriter.value.trim().toLowerCase();

    filtered = allBooks.filter(b =>
      (activeYear === 'all' || String(b.year) === activeYear) &&
      (!bq || b.book.toLowerCase().includes(bq)) &&
      (!wq || b.writer.toLowerCase().includes(wq)));

    if (resetPage) currentPage = 1;
    renderList();
  }

  /* ---------- paragraphs ----------
     Every line break the writer typed starts a new paragraph. A long block
     with no breaks is split into paragraphs of a few sentences, at "။" (or
     ". ! ?" in English), so a review never shows as one wall of text. */
  const PARA_SPLIT_OVER = 520;   // only split blocks longer than this (characters)
  const PARA_TARGET     = 330;   // aim for paragraphs about this long
  const PARA_MIN_LAST   = 140;   // a shorter last piece joins the one before

  function sentencesOf(block) {
    return block
      .split(/(?<=။)\s*|(?<=(?<!\b(?:Dr|Mr|Mrs|Ms|St|Prof|U))[.!?])\s+(?=\S)/)
      .map(s => s.trim())
      .filter(Boolean);
  }

  function paragraphsOf(text) {
    const out = [];
    for (const raw of text.split(/\n+/)) {
      const block = raw.replace(/[ \t]+/g, ' ').trim();
      if (!block) continue;
      if (block.length <= PARA_SPLIT_OVER) { out.push(block); continue; }
      const pieces = [];
      let cur = '';
      for (const s of sentencesOf(block)) {
        cur = cur ? cur + ' ' + s : s;
        if (cur.length >= PARA_TARGET) { pieces.push(cur); cur = ''; }
      }
      if (cur) {
        if (pieces.length && cur.length < PARA_MIN_LAST) pieces[pieces.length - 1] += ' ' + cur;
        else pieces.push(cur);
      }
      out.push(...pieces);
    }
    return out;
  }

  /* ---------- home: list ---------- */
  function excerptOf(comment) {
    // first paragraph is enough; CSS trims it to three lines
    const first = comment.split(/\n\s*\n/)[0].replace(/\s+/g, ' ').trim();
    return first.length > 600 ? first.slice(0, 600) : first;
  }

  function renderList() {
    const total = filtered.length;
    const totalPages = Math.ceil(total / PER_PAGE);
    if (currentPage > totalPages) currentPage = totalPages || 1;

    if (!total) {
      listEl.innerHTML = '<p class="state">ကိုက်ညီသော စာအုပ် မတွေ့ပါ</p>';
      pagesEl.innerHTML = '';
      countEl.textContent = '';
      return;
    }

    const narrowed = qBook.value || qWriter.value || activeYear !== 'all';
    countEl.textContent = narrowed ? `တွေ့ရှိသည် — ${total} အုပ်` : `စုစုပေါင်း ${total} အုပ်`;

    const page = filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

    listEl.innerHTML = page.map(b => {
      const href = '#/' + encodeURIComponent(b.slug);
      const when = whenText(b);
      return `<article class="card${b.cover ? ' has-cover' : ''}">`
        + (b.cover ? `<a class="cover-link" href="${href}" tabindex="-1">${coverImg(b)}</a>` : '')
        + '<div>'
        +   (when ? `<div class="card-meta">${txt(when)}</div>` : '')
        +   `<h2><a href="${href}">${txt(b.book)}</a></h2>`
        +   (b.writer ? `<p class="writer">${txt(b.writer)}</p>` : '')
        +   (b.comment ? `<p class="excerpt">${txt(excerptOf(b.comment))}</p>` : '')
        +   (b.comment ? `<a class="more" href="${href}">ဆက်ဖတ်ရန် →</a>` : '')
        + '</div></article>';
    }).join('');

    renderPages(totalPages);
  }

  function renderPages(totalPages) {
    if (totalPages <= 1) { pagesEl.innerHTML = ''; return; }

    const nums = pageNumbers(currentPage, totalPages).map(p =>
      p === '…'
        ? '<span class="dots">…</span>'
        : `<button class="page${p === currentPage ? ' on' : ''}" data-page="${p}">${p}</button>`
    ).join('');

    pagesEl.innerHTML = '<nav class="pages">'
      + `<button class="page" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>←</button>`
      + nums
      + `<button class="page" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>→</button>`
      + '</nav>'
      + `<p class="page-note">စာမျက်နှာ ${currentPage} / ${totalPages}</p>`;
  }

  pagesEl.addEventListener('click', e => {
    const btn = e.target.closest('.page');
    if (!btn || btn.disabled) return;
    currentPage = +btn.dataset.page;
    renderList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function pageNumbers(c, t) {
    if (t <= 7) return Array.from({ length: t }, (_, i) => i + 1);
    const p = [1];
    if (c > 3) p.push('…');
    for (let i = Math.max(2, c - 1); i <= Math.min(t - 1, c + 1); i++) p.push(i);
    if (c < t - 2) p.push('…');
    p.push(t);
    return p;
  }

  qBook.addEventListener('input', () => applyFilters());
  qWriter.addEventListener('input', () => applyFilters());
  document.getElementById('clear').addEventListener('click', () => {
    qBook.value = '';
    qWriter.value = '';
    applyFilters();
  });

  /* ---------- one post ---------- */
  function renderPost(slug) {
    const i = allBooks.findIndex(b => b.slug === slug);
    if (i < 0) {
      document.title = SITE_TITLE;
      postEl.innerHTML = '<p class="state">ဒီစာမျက်နှာ မတွေ့ပါ</p>';
      return;
    }

    const b = allBooks[i];
    const newer = allBooks[i - 1];   // list is newest first
    const older = allBooks[i + 1];
    document.title = b.book + ' – ' + SITE_TITLE;

    const meta = [];
    if (b.transFrom)  meta.push(['ဘာသာပြန်', b.transFrom]);
    if (b.origBook)   meta.push(['မူရင်းစာအုပ်', b.origBook]);
    if (b.origWriter) meta.push(['မူရင်းစာရေးသူ', b.origWriter]);

    const when = whenText(b);
    const neighbour = (x, cls, label) => x
      ? `<a class="${cls}" href="#/${encodeURIComponent(x.slug)}"><small>${label}</small><span>${txt(x.book)}</span></a>`
      : '';

    postEl.innerHTML =
        `<div class="post-head${b.cover ? ' has-cover' : ''}">`
      +   (b.cover
            ? '<figure class="cover-fig">' + coverImg(b)
              + (b.coverSrc ? `<figcaption class="cover-credit">Cover: ${creditHtml(b.coverSrc)}</figcaption>` : '')
              + '</figure>'
            : '')
      +   '<div>'
      +     (when ? `<div class="post-meta">${txt(when)}</div>` : '')
      +     `<h1>${txt(b.book)}</h1>`
      +     (b.writer ? `<p class="writer">${txt(b.writer)}</p>` : '')
      +   '</div>'
      + '</div>'
      + (meta.length
          ? '<div class="meta">' + meta.map(([l, v]) =>
              `<div><b>${txt(l)}</b><span>${txt(v)}</span></div>`).join('') + '</div>'
          : '')
      + (b.comment
          ? '<div class="note-label">စာအုပ်ဖတ်ပြီးတွေးမိတာ</div>'
            + '<div class="note">'
            +   paragraphsOf(b.comment).map(p => `<p>${txt(p)}</p>`).join('')
            + '</div>'
          : '')
      + '<div class="post-tools">'
      +   '<button class="link theme-btn"></button>'
      +   '<button class="link" id="copyLink">Link ကူးရန်</button>'
      + '</div>'
      + '<nav class="neighbours">'
      +   neighbour(older, 'prev', '← အရင်')
      +   neighbour(newer, 'next', 'နောက် →')
      + '</nav>';

    paintThemeLabels();

    document.getElementById('copyLink').addEventListener('click', async e => {
      const btn = e.currentTarget;
      try {
        await navigator.clipboard.writeText(location.href);
        btn.textContent = 'ကူးပြီးပါပြီ ✓';
      } catch (err) {
        btn.textContent = location.href;
      }
      setTimeout(() => { btn.textContent = 'Link ကူးရန်'; }, 2000);
    });
  }

  route();
  loadData();
</script>
</body>
</html>
